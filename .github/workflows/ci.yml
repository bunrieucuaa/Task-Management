name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Lint is non-blocking: the repo has pre-existing lint debt in app code
      # (shadcn/ui files, a few pages/dialogs). Test files are lint-clean. Flip
      # this to a blocking step once that debt is cleared.
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

      - name: Build (vite + tsc)
        run: npm run build

      - name: Run tests
        run: npm test
