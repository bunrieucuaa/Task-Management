name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Lint debt cleared (2026-06-18): app code fixed, generated shadcn/ui +
      # entry point scoped out in eslint.config.js. Lint is now a blocking gate.
      - name: Lint
        run: npm run lint

      - name: Build (vite + tsc)
        run: npm run build

      - name: Run tests (with coverage thresholds)
        run: npm run test:coverage
